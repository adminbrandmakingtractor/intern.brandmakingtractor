<div id="site-header"></div>

<section class="hero" style="padding:64px 0 56px;">
  <div class="container hero-inner">
    <div class="hero-tagline">CONTACT US</div>
    <h1 style="font-size:clamp(28px,4vw,42px);">Questions about an internship?</h1>
    <p class="lead">Reach out and our team will get back to you within 1–2 business days.</p>
  </div>
</section>

<section class="section-tight">
  <div class="container">
    <div class="contact-grid">
      <div class="contact-info-card fade-up">
        <h3>Get in Touch</h3>
        <div class="contact-info-row"><div class="ico">✉️</div><div><strong>Email</strong><div id="contactEmail" style="color:rgba(255,255,255,.8);"></div></div></div>
        <div class="contact-info-row"><div class="ico">📞</div><div><strong>Phone</strong><div id="contactPhone" style="color:rgba(255,255,255,.8);"></div></div></div>
        <div class="contact-info-row"><div class="ico">📍</div><div><strong>Address</strong><div id="contactAddress" style="color:rgba(255,255,255,.8);"></div></div></div>
        <div class="contact-info-row"><div class="ico">🕒</div><div><strong>Hours</strong><div style="color:rgba(255,255,255,.8);">Mon – Sat, 10 AM – 7 PM IST</div></div></div>
        <p style="margin-top:24px;color:rgba(255,255,255,.65);font-size:13.5px;">1 Week Training + Direct Live Client Project Experience. Learn • Create • Grow.</p>
      </div>

      <form id="contactForm" class="form-card fade-up">
        <div id="formMsg" class="form-msg"></div>
        <h3 style="margin-bottom:18px;">Send Us a Message</h3>
        <div class="field hp-field" aria-hidden="true"><label for="cWebsite">Leave blank</label><input type="text" id="cWebsite" name="website" tabindex="-1" autocomplete="off"></div>
        <div class="form-grid">
          <div class="field"><label>Full Name <span class="req">*</span></label><input type="text" id="cName" autocomplete="name" required></div>
          <div class="field"><label>Email <span class="req">*</span></label><input type="email" id="cEmail" autocomplete="email" required></div>
          <div class="field"><label>Phone</label><input type="tel" id="cPhone" autocomplete="tel"></div>
          <div class="field"><label>Subject <span class="req">*</span></label>
            <select id="cSubject" required>
              <option value="">Select a subject</option>
              <option>Internship Enquiry</option>
              <option>Application Status</option>
              <option>Certificate / Verification</option>
              <option>Partnership / Client Enquiry</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field full"><label>Message <span class="req">*</span></label><textarea id="cMessage" required placeholder="How can we help?"></textarea></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="cSubmitBtn">Send Message</button>
      </form>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("contactEmail").innerHTML = `<a href="mailto:${BRAND.supportEmail}" style="color:inherit;text-decoration:underline;">${BRAND.supportEmail}</a>`;
  document.getElementById("contactPhone").innerHTML = `<a href="tel:${BRAND.supportPhone.replace(/\s+/g,"")}" style="color:inherit;text-decoration:underline;">${BRAND.supportPhone}</a>`;
  document.getElementById("contactAddress").textContent = BRAND.address;
});

document.getElementById("contactForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("formMsg");
  const btn = document.getElementById("cSubmitBtn");

  // Honeypot: real visitors never see or fill this field — a filled value means a bot.
  if(document.getElementById("cWebsite").value.trim()){
    return;
  }

  const payload = {
    fullName: document.getElementById("cName").value.trim(),
    email: document.getElementById("cEmail").value.trim(),
    phone: document.getElementById("cPhone").value.trim(),
    subject: document.getElementById("cSubject").value,
    message: document.getElementById("cMessage").value.trim()
  };
  setBtnLoading(btn, true, "Sending...");
  const res = await apiCall("submitContactQuery", payload);
  setBtnLoading(btn, false);
  if(res.success){
    pushConversionEvent("contact_submitted", { subject: payload.subject });
    showMsg(msg, "success", "Thanks! Your message has been received — we'll get back to you soon.");
    document.getElementById("contactForm").reset();
  }else{
    showMsg(msg, "error", res.error || "Something went wrong. Please try again.");
  }
});
</script>

<div id="notFound" class="container" style="display:none;padding:80px 24px;text-align:center;">

  <p>This internship opening may have been removed or the link is incorrect.</p>

<script>
// A couple of internship titles are long enough that "<title> | intern.brandmakingtractor.com"
// would run past ~60 characters (the practical limit before Google truncates it in
// search results) — shortened only for the <title>/OG/Twitter tags; the on-page H1
// and everything else still shows the full official track name.
const SEO_TITLE_OVERRIDES = {
  "INT-WD-001": "Website Development Internship",
  "INT-WP-001": "WordPress Development Internship"
};

// Meta descriptions should stay under ~157 characters (Google's soft cutoff) —
// truncates at the last whole word instead of mid-word.
function truncateForMeta(text, maxLen){
  if(!text || text.length <= maxLen) return text || "";
  const cut = text.slice(0, maxLen);
  const lastSpace = cut.lastIndexOf(" ");
  return (lastSpace > 0 ? cut.slice(0, lastSpace) : cut).trim() + "…";
}

function render(){
  const id = qs("id");
  const item = getInternshipById(id);
  if(!item){
    document.getElementById("notFound").style.display = "block";
    return;
  }
  pushConversionEvent("internship_view", { internship_id: item.Opening_ID, internship_title: item.Title, department: item.Department });
  const seoTitle = SEO_TITLE_OVERRIDES[item.Opening_ID] || item.Title;
  const seoDesc = truncateForMeta(item.Description, 157);
  document.getElementById("pageTitle").textContent = `${seoTitle} | intern.brandmakingtractor.com`;
  document.getElementById("pageDesc").setAttribute("content", seoDesc);
  const detailUrl = `https://intern.brandmakingtractor.com/internship-detail?id=${item.Opening_ID}`;
  document.getElementById("pageCanonical").setAttribute("href", detailUrl);
  document.getElementById("pageOgTitle").setAttribute("content", `${seoTitle} | intern.brandmakingtractor.com`);
  document.getElementById("pageOgDesc").setAttribute("content", seoDesc);
  document.getElementById("pageOgUrl").setAttribute("content", detailUrl);
  document.getElementById("pageTwTitle").setAttribute("content", `${seoTitle} | intern.brandmakingtractor.com`);
  document.getElementById("pageTwDesc").setAttribute("content", seoDesc);
  document.getElementById("breadcrumbSchema").textContent = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://intern.brandmakingtractor.com/" },
      { "@type": "ListItem", "position": 2, "name": "Internships", "item": "https://intern.brandmakingtractor.com/internships" },
      { "@type": "ListItem", "position": 3, "name": item.Title, "item": detailUrl }
    ]
  });

  document.getElementById("detailContent").innerHTML = `
    <section class="detail-hero">
      <div class="container">
        <a href="internships" style="color:rgba(255,255,255,.7);font-size:14px;">&larr; Back to all internships</a>
        <div class="dept" style="margin-top:16px;">${item.Department}</div>
        <h1>${item.icon} ${item.Title}</h1>
        <p class="lead" style="color:rgba(255,255,255,.82);">${item.Description}</p>
        <div class="program-pill-row" style="margin-top:20px;">
          <span class="program-pill">1 Week Training + Direct Live Client Project Experience</span>
          <span class="program-pill">4 / 6 / 8 Weeks Available</span>
        </div>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="detail-grid">
          <div>
            <div class="detail-block fade-up" id="durationBlock">
              ${renderDurationStructureBlock()}
            </div>

            <div class="detail-block fade-up">
              <h2>What You'll Learn</h2>
              <ul>${item.What_You_Will_Learn.map(x => `<li>${x}</li>`).join("")}</ul>
            </div>

            <div class="detail-block fade-up">
              <h2>Responsibilities</h2>
              <ul>${item.Responsibilities.map(x => `<li>${x}</li>`).join("")}</ul>
            </div>

            <div class="detail-block fade-up">
              <h2>Who Should Apply</h2>
              <p style="margin:0;">${item.Who_Should_Apply}</p>
            </div>
          </div>

          <div>
            <div class="sidebar-card fade-up">
              <h3 style="margin-bottom:16px;">Internship Overview</h3>
              <div class="sidebar-row"><span>Department</span><span>${item.Department}</span></div>
              <div class="sidebar-row"><span>Structure</span><span>1 Wk Training + Live Project</span></div>
              <div class="sidebar-row"><span>Duration Options</span><span>4 / 6 / 8 Weeks</span></div>
              <div class="sidebar-row"><span>Fee From</span><span>₹1,500</span></div>
              <div class="sidebar-row"><span>Work Mode</span><span>${item.Work_Mode}</span></div>
              <div class="sidebar-row"><span>Openings</span><span>${item.Openings}</span></div>
              <div class="sidebar-row"><span>Status</span><span><span class="badge ${statusBadgeClass(item.Status)}">${item.Status}</span></span></div>
              <div class="skill-tags" style="margin:16px 0;">${item.Skills.map(s=>`<span class="skill-tag">${s}</span>`).join("")}</div>
              <a href="#" class="btn btn-primary btn-block" onclick="event.preventDefault(); openApplyModal('${item.Opening_ID}');">Apply Now</a>
              <a href="#durationBlock" class="btn btn-ghost btn-block" style="margin-top:10px;">See Full Duration &amp; Fee Table</a>
            </div>

            <div class="sidebar-card fade-up" style="position:static;">
              <h3 style="margin-bottom:12px;">Certificate &amp; Recognition</h3>
              <p style="font-size:13.5px;margin-bottom:8px;">🎓 Certificate of Completion for every intern.</p>
              <p style="font-size:13.5px;margin-bottom:0;">🌟 Recommendation Letter for exceptional performers — not guaranteed for everyone.</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  `;
  refreshFadeUp();
}
document.addEventListener("DOMContentLoaded", render);
</script>

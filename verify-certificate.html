<div id="site-header"></div>

<section class="hero" style="padding:64px 0 56px;">
  <div class="container hero-inner">
    <div class="hero-tagline">CERTIFICATE VERIFICATION</div>
    <h1 style="font-size:clamp(28px,4vw,42px);">Verify a Certificate</h1>
    <p class="lead">Enter a Credential ID to instantly confirm it was issued by intern.brandmakingtractor.com.</p>
  </div>
</section>

<section class="section-tight">
  <div class="container" style="max-width:640px;">
    <form id="verifyForm" class="form-card" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
      <div class="field" style="flex:1;min-width:220px;margin-bottom:0;">
        <label>Credential ID <span class="req">*</span></label>
        <input type="text" id="credentialId" placeholder="e.g. BMT-CRED-2026-000001" required>
      </div>
      <button type="submit" class="btn btn-primary" id="verifyBtn">Verify</button>
    </form>

    <div id="verifyResult" style="margin-top:28px;"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>
<script>
async function runVerification(id){
  const resultEl = document.getElementById("verifyResult");
  const btn = document.getElementById("verifyBtn");
  setBtnLoading(btn, true, "Verifying...");
  resultEl.innerHTML = "";
  const res = await apiGet("verifyCertificate", { credentialId: id });
  setBtnLoading(btn, false);

  if(res.success && res.data && res.data.valid){
    const c = res.data;
    pushConversionEvent("certificate_verification", { credential_id: c.credentialId, result: "valid" });
    resultEl.innerHTML = `
      <div class="result-card result-verified fade-up in">
        <div class="result-icon ok">✓</div>
        <h2>✓ CERTIFICATE VERIFIED</h2>
        <p>This is a valid certificate issued by intern.brandmakingtractor.com.</p>
        <table class="result-table">
          <tr><td>Name</td><td>${escapeHtml(c.name)}</td></tr>
          <tr><td>Internship</td><td>${escapeHtml(c.internshipTitle)}</td></tr>
          <tr><td>Duration</td><td>${escapeHtml(c.duration)}</td></tr>
          <tr><td>Start Date</td><td>${formatDate(c.startDate)}</td></tr>
          <tr><td>Completion Date</td><td>${formatDate(c.completionDate)}</td></tr>
          <tr><td>Certificate Issue Date</td><td>${formatDate(c.issueDate)}</td></tr>
          <tr><td>Certificate Valid Until</td><td>${formatDate(c.validUntil)}</td></tr>
          <tr><td>Credential ID</td><td>${escapeHtml(c.credentialId)}</td></tr>
          <tr><td>Status</td><td><span class="badge ${c.status === 'VALID' ? 'badge-open' : 'badge-closed'}">${c.status || "VALID"}</span></td></tr>
        </table>
      </div>`;
  }else{
    pushConversionEvent("certificate_verification", { credential_id: id, result: "invalid" });
    resultEl.innerHTML = `
      <div class="result-card result-invalid fade-up in">
        <div class="result-icon bad">✕</div>
        <h2>Certificate Not Found</h2>
        <p>${res.error || "We couldn't verify a certificate with that Credential ID. Please double-check and try again."}</p>
      </div>`;
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const presetId = qs("credentialId") || qs("id");
  if(presetId){
    document.getElementById("credentialId").value = presetId;
    runVerification(presetId);
  }
});

document.getElementById("verifyForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = document.getElementById("credentialId").value.trim();
  if(!id) return;
  runVerification(id);
});
</script>
